app:
  url: ${APP_URL:http://localhost:8081}
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECTION_TIMEOUT:500ms}
  application:
    name: shortener-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/shortener_postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:secret}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

